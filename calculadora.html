<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Futbol</title>


<style>


body{

background-color:#010e26;
color:#FFFFFF;
font-family:Arial, sans-serif;

}



header{

display:flex;
justify-content:center;
border:1px solid white;
padding:20px;

}



.titulo{

color:white;

}



.calculadora{

border:1px solid white;
width:70%;
margin:40px auto;
padding:30px;
text-align:center;

}



input{

width:70%;
padding:10px;
margin:10px;

background:transparent;
color:white;

border:2px solid #39ff14;
border-radius:6px;

}



.boton_1{

padding:12px 25px;

color:#FFFFFF;

background:transparent;

border:2px solid #39ff14;

border-radius:6px;

margin:10px;

cursor:pointer;

box-shadow:
0 0 8px rgba(57,255,20,0.6);

}



.boton_1:hover{

background:#39ff14;
color:#010e26;

}



#resultado{

font-size:25px;
color:#39ff14;
margin-top:20px;

}



</style>


</head>


<body>



<header>

<h1 class="titulo">
⚽ Calculadora de Rendimiento ⚽
</h1>

</header>




<div class="calculadora">


<h2>
Calcula tu promedio de notas
</h2>


<p>
Ingresa tus notas como si fueran tus partidos de la temporada
</p>



<input type="number" id="nota1" placeholder="Nota 1">


<input type="number" id="nota2" placeholder="Nota 2">


<input type="number" id="nota3" placeholder="Nota 3">


<input type="number" id="nota4" placeholder="Nota 4">



<br>



<button class="boton_1" id="calcular">

Calcular promedio

</button>



<a href="Menu.html" class="boton_1">

Volver al menú

</a>



<div id="resultado">

</div>



</div>




<script>


let boton=document.getElementById("calcular");



boton.addEventListener("click",()=>{


let n1=parseFloat(document.getElementById("nota1").value);

let n2=parseFloat(document.getElementById("nota2").value);

let n3=parseFloat(document.getElementById("nota3").value);

let n4=parseFloat(document.getElementById("nota4").value);



if(isNaN(n1)||isNaN(n2)||isNaN(n3)||isNaN(n4)){


alert("Completa todas las notas");


return;


}



let promedio=(n1+n2+n3+n4)/4;



let mensaje="Promedio: "+promedio.toFixed(2);



if(promedio>=3){

mensaje+=" 🏆 Buen rendimiento del jugador";

}

else{

mensaje+=" ⚽ Sigue entrenando para mejorar";

}



document.getElementById("resultado").innerHTML=mensaje;



});



</script>



</body>

</html>
